# configmap-web.yaml

apiVersion: v1
kind: ConfigMap
metadata:
  name: web-content
  namespace: default
data:
  # Это ключ, по которому мы будем обращаться к данным
  # Внутри лежит HTML-код страницы
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>Моя страница из ConfigMap</title>
    </head>
    <body>
      <h1>Привет от Kubernetes!</h1>
      <p>Эта страница загружена из ConfigMap.</p>
    </body>
    </html>